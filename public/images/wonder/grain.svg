<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
  <!-- Wonder paper grain: the same ink + cream speckle filters as the series art (tileable) -->
  <filter id="g" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="9" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.086  0 0 0 0 0.067  0 0 0 0 0.180  3.2 0 0 0 -1.75"/>
  </filter>
  <filter id="s" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" seed="21" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.953  0 0 0 0 0.914  0 0 0 0 0.839  3.4 0 0 0 -1.95"/>
  </filter>
  <rect width="480" height="480" filter="url(#g)" opacity="0.5"/>
  <rect width="480" height="480" filter="url(#s)" opacity="0.35"/>
</svg>
